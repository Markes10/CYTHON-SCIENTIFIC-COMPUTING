[build-system]
requires = ["setuptools>=61.0", "wheel", "Cython>=3.0", "numpy>=1.20"]
build-backend = "setuptools.build_meta"

[project]
name = "cython-scientific-computing"
version = "1.0.0"
description = "High-performance C-accelerated sparse linear algebra and Runge-Kutta ODE solvers"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7"
]
